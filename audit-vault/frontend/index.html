<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Audit Evidence Vault — Banking</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;0,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#060810;--s1:#0b0f1c;--s2:#101523;--s3:#16203a;--s4:#1d2948;
  --bd:#1e2b44;--bd2:#263650;
  --teal:#00d4b8;--teal2:#00b09a;--gold:#f0a32e;--violet:#8b7ff5;--violet2:#6c60e0;
  --ok:#15d66e;--warn:#f5a623;--err:#f43f5e;--info:#38bdf8;
  --txt:#dde6f5;--dim:#6d86a8;--faint:#344d6e;
  --mono:'DM Mono',monospace;--ui:'Plus Jakarta Sans',sans-serif;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:14px;line-height:1.5}
::selection{background:#00d4b820}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

/* ─── LOGIN ──────────────────────────────────────────── */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 70% 50% at 25% 20%,#071f3e 0%,transparent 60%),
             radial-gradient(ellipse 50% 40% at 80% 80%,#0a1830 0%,transparent 55%),var(--bg);
}
.login-box{
  width:440px;padding:50px 44px;background:var(--s1);
  border:1px solid var(--bd);border-radius:var(--r);position:relative;overflow:hidden;
}
.login-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--teal) 40%,var(--violet) 70%,transparent);
}
.l-logo{display:flex;align-items:center;gap:14px;margin-bottom:42px}
.l-hex{
  width:46px;height:46px;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal),var(--violet));
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:grid;place-items:center;font-size:20px;
}
.l-name{font-size:15px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--teal)}
.l-sub{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:2px;margin-top:2px}
.lf{margin-bottom:18px}
.lf label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.lf input{
  width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--txt);
  padding:11px 14px;font-family:var(--mono);font-size:13px;border-radius:var(--r);
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.lf input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #00d4b814}
.l-btn{
  width:100%;padding:13px;margin-top:4px;border:none;cursor:pointer;border-radius:var(--r);
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  color:#01201c;font-family:var(--ui);font-weight:800;font-size:12px;
  letter-spacing:3px;text-transform:uppercase;transition:opacity .18s,transform .1s;
}
.l-btn:hover{opacity:.87}.l-btn:active{transform:scale(.98)}
.l-err{
  background:#2d0a14;border:1px solid var(--err);color:var(--err);
  padding:9px 12px;border-radius:var(--r);font-family:var(--mono);font-size:11px;margin-bottom:14px;
}
.l-creds{
  margin-top:22px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px 16px;font-family:var(--mono);font-size:10px;line-height:2.2;color:var(--dim);
}
.l-creds strong{color:var(--txt);font-weight:500}

/* ─── SHELL ───────────────────────────────────────────── */
.app{display:grid;grid-template-rows:52px 1fr;height:100vh;overflow:hidden}
.topbar{
  background:var(--s1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:50;flex-shrink:0;
}
.tb-brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--teal)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:plse 2.4s ease-in-out infinite}
@keyframes plse{0%,100%{opacity:1}50%{opacity:.3}}
.tb-sub{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:2px}
.tb-r{display:flex;align-items:center;gap:12px}
.role-tag{padding:3px 11px;border-radius:20px;border:1px solid;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase}
.rt-a{border-color:#00d4b840;color:var(--teal);background:#00d4b80c}
.rt-b{border-color:#15d66e40;color:var(--ok);background:#15d66e0c}
.rt-x{border-color:#f43f5e40;color:var(--err);background:#f43f5e0c}
.tb-user{font-family:var(--mono);font-size:11px;color:var(--dim)}
.sout{background:none;border:1px solid var(--bd);color:var(--dim);padding:5px 12px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:1px;border-radius:var(--r);transition:all .18s}
.sout:hover{border-color:var(--err);color:var(--err)}

.layout{display:grid;grid-template-columns:210px 1fr;height:calc(100vh - 52px);overflow:hidden}

/* ─── SIDEBAR ─────────────────────────────────────────── */
.sidebar{background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 0;overflow-y:auto}
.sb-lbl{font-family:var(--mono);font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--faint);padding:0 18px;margin:14px 0 5px;display:block}
.sb-lbl:first-child{margin-top:0}
.sb-lk{
  display:flex;align-items:center;gap:11px;padding:9px 14px;cursor:pointer;
  border-left:2px solid transparent;font-size:13px;font-weight:500;color:var(--dim);
  transition:all .14s;margin:1px 8px;border-radius:0 var(--r) var(--r) 0;
}
.sb-lk:hover{background:var(--s2);color:var(--txt);border-left-color:var(--bd2)}
.sb-lk.act{background:var(--s2);color:var(--teal);border-left-color:var(--teal);font-weight:600}
.sb-lk.act.ai{color:var(--violet);border-left-color:var(--violet)}
.sb-lk.act.gold{color:var(--gold);border-left-color:var(--gold)}
.sb-ico{width:17px;text-align:center;font-size:14px;flex-shrink:0}

.app-sel{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--bd)}
.app-sel label{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:5px;padding-left:4px}
.app-sel select{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--txt);padding:8px 10px;font-family:var(--mono);font-size:12px;border-radius:var(--r);outline:none;transition:border-color .18s}
.app-sel select:focus{border-color:var(--teal)}

/* ─── CONTENT ─────────────────────────────────────────── */
.content{overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:16px}

/* ─── CARD ────────────────────────────────────────────── */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.ch{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ct{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:8px}
.ct.vio{color:var(--violet)}.ct.gld{color:var(--gold)}
.cb{padding:18px}

/* ─── FORM ────────────────────────────────────────────── */
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.fg input,.fg select,.fg textarea{background:var(--bg);border:1px solid var(--bd);color:var(--txt);padding:9px 12px;font-family:var(--mono);font-size:12px;border-radius:var(--r);outline:none;transition:border-color .18s,box-shadow .18s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--teal);box-shadow:0 0 0 2px #00d4b810}
.fg textarea{resize:vertical}
.gr{display:grid;gap:12px}
.gr2{grid-template-columns:1fr 1fr}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border:none;cursor:pointer;border-radius:var(--r);font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:opacity .18s,transform .1s;white-space:nowrap}
.btn:hover{opacity:.85}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-teal{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#01201c}
.btn-warn{background:transparent;border:1px solid #f5a62360;color:var(--warn)}
.btn-sm{padding:4px 11px;font-size:9px;letter-spacing:1.5px}

/* ─── COVERAGE ────────────────────────────────────────── */
.cov-layout{display:grid;grid-template-columns:128px 1fr;gap:24px;align-items:center}
.dring{position:relative;width:128px;height:128px;flex-shrink:0}
.dring svg{transform:rotate(-90deg)}
.dring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.d-pct{font-family:var(--ui);font-size:28px;font-weight:800;line-height:1}
.d-lbl{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:2px;letter-spacing:1px}
.cov-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.tile .v{font-family:var(--ui);font-size:26px;font-weight:800;line-height:1;margin-bottom:3px}
.tile .l{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.5px}
.c-ok{color:var(--ok)}.c-err{color:var(--err)}.c-warn{color:var(--warn)}.c-dim{color:var(--dim)}

/* ─── TABLE ───────────────────────────────────────────── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:9px 16px;text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--bd);background:var(--bg)}
td{padding:12px 16px;border-bottom:1px solid var(--bd);vertical-align:middle;font-size:12px}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover td{background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;border:1px solid;font-family:var(--mono);font-size:10px;white-space:nowrap}
.chip-ok{border-color:#15d66e40;color:var(--ok);background:#15d66e0c}
.chip-err{border-color:#f43f5e40;color:var(--err);background:#f43f5e0c}
.chip-warn{border-color:#f5a62340;color:var(--warn);background:#f5a6230c}
.chip-dim{border-color:var(--bd);color:var(--dim);background:transparent}
.chip-exc{border-color:#f5a62340;color:var(--warn);background:#f5a6230a}
.tbtn{background:none;border:1px solid var(--bd);color:var(--dim);padding:3px 10px;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:1px;border-radius:var(--r);transition:all .14s}
.tbtn:hover{border-color:var(--teal);color:var(--teal)}
.tbtn.w{border-color:#f5a62340;color:var(--warn)}.tbtn.w:hover{background:#f5a6230a}

/* ─── CHATBOT ─────────────────────────────────────────── */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 52px - 44px);min-height:400px}
.chat-hist{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;
  padding:18px;background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r) var(--r) 0 0;min-height:0;
}
.mw{display:flex;flex-direction:column;max-width:82%}
.mw.u{align-self:flex-end;align-items:flex-end}
.mw.b{align-self:flex-start;align-items:flex-start}
.mw.u .bbl{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#01201c;font-weight:500;border-radius:var(--r) var(--r) 0 var(--r)}
.mw.b .bbl{background:var(--s2);border:1px solid var(--bd);color:var(--txt);border-radius:var(--r) var(--r) var(--r) 0}
.bbl{padding:11px 15px;font-size:13px;line-height:1.65}
.bbl p{margin-bottom:7px}.bbl p:last-child{margin-bottom:0}
.bbl ul{margin:5px 0 5px 16px;display:flex;flex-direction:column;gap:2px}
.bbl strong{font-weight:700}
.bbl code{font-family:var(--mono);font-size:11px;background:#fff1;padding:1px 5px;border-radius:3px}
.bot-tag{font-family:var(--mono);font-size:9px;color:var(--violet);letter-spacing:1px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.mts{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:4px}
.typing{align-self:flex-start}
.typing-bbl{display:flex;gap:5px;padding:12px 15px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);width:fit-content}
.td{width:6px;height:6px;border-radius:50%;background:var(--violet);animation:tdp 1.2s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tdp{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.doc-bubble{background:var(--s3);border:1px solid var(--bd2);border-radius:var(--r);padding:10px 13px;margin-top:6px;display:flex;align-items:center;gap:10px;cursor:default}
.doc-bubble-ico{font-size:20px;flex-shrink:0}
.doc-bubble-name{font-size:12px;font-weight:600}
.doc-bubble-meta{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:1px}
.doc-bubble-badge{margin-left:auto;padding:2px 9px;border-radius:20px;font-family:var(--mono);font-size:9px;border:1px solid var(--ok);color:var(--ok);background:#15d66e0c;white-space:nowrap;flex-shrink:0}
.chat-bar{display:flex;background:var(--s2);border:1px solid var(--bd);border-top:none;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.chat-bar textarea{flex:1;background:transparent;border:none;color:var(--txt);padding:13px 15px;font-family:var(--ui);font-size:13px;outline:none;resize:none;height:50px;line-height:1.5}
.chat-bar textarea::placeholder{color:var(--faint)}
.csend{padding:0 22px;background:var(--violet);color:#fff;border:none;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:opacity .18s;border-left:1px solid var(--bd)}
.csend:hover{opacity:.86}.csend:disabled{opacity:.35;cursor:not-allowed}

/* ─── UPLOAD ──────────────────────────────────────────── */
.dz{border:2px dashed var(--bd);border-radius:var(--r);padding:30px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
.dz:hover,.dz.over{border-color:var(--ok);background:#15d66e08}
.dz-ic{font-size:36px;margin-bottom:6px}
.dz-tx{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px}
.dz-ch{font-family:var(--mono);font-size:11px;color:var(--ok);margin-top:8px;font-weight:500}
.dcrd{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dcrd:hover{border-color:var(--bd2)}
.dn{font-size:13px;font-weight:600;margin-bottom:2px}
.dm{font-family:var(--mono);font-size:10px;color:var(--dim)}
.stored{padding:3px 10px;border-radius:20px;font-family:var(--mono);font-size:9px;letter-spacing:1px;border:1px solid var(--ok);color:var(--ok);background:#15d66e0c;white-space:nowrap;flex-shrink:0}

/* ─── EXCEPTIONS ──────────────────────────────────────── */
.exc-card{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);border-left:3px solid var(--warn);padding:13px 15px;margin-bottom:8px}
.exc-card.RAF{border-left-color:var(--err)}.exc-card.WAIVER{border-left-color:var(--info)}
.exc-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.exc-id{font-family:var(--mono);font-size:11px;color:var(--warn);font-weight:500}
.exc-mt{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ─── MODAL ───────────────────────────────────────────── */
.ov{position:fixed;inset:0;background:#000000cc;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);width:min(620px,100%);max-height:88vh;overflow-y:auto;border-top:2px solid var(--teal)}
.modal.exc{border-top-color:var(--warn)}
.mhd{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--s1);z-index:1}
.mttl{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--teal);letter-spacing:1px}
.mttl.w{color:var(--warn)}
.mx{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:0 4px;transition:color .14s}
.mx:hover{color:var(--txt)}
.mbdy{padding:18px}
.mr{display:flex;gap:10px;margin-bottom:8px;font-size:12px}
.mk{font-family:var(--mono);color:var(--dim);width:145px;flex-shrink:0;font-size:11px}
.mv{color:var(--txt);word-break:break-all}
.ms{font-family:var(--mono);font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal);margin:14px 0 9px;display:flex;align-items:center;gap:8px}
.ms::after{content:'';flex:1;height:1px;background:var(--bd)}

/* ─── UTILS ───────────────────────────────────────────── */
.empty{text-align:center;padding:46px 20px;font-family:var(--mono);font-size:12px;color:var(--dim);line-height:2.2}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
// ═══════════════════════════════════════════════════════ CONSTANTS & CONFIG

const APPS = ["APP001","APP002","APP003"];

const CHECKLIST = [
  {id:"BK001", title:"CMDB Integration",      category:"Infrastructure"},
  {id:"BK002", title:"CyberArk Integration",  category:"Security"},
  {id:"BK003", title:"Architecture Diagram",  category:"Documentation"},
  {id:"BK004", title:"Data Flow Diagram",     category:"Documentation"},
  {id:"BK005", title:"OS Baseline Sign-off",  category:"Compliance"},
  {id:"BK006", title:"DB Sign-off",           category:"Compliance"},
  {id:"BK007", title:"DAM Integration",       category:"Security"},
];

// ── Gemini config — key lives here only, never exposed in UI ──
const GEMINI_KEY   = "YOUR_GEMINI_API_KEY_HERE";
const GEMINI_BASE  = "https://generativelanguage.googleapis.com/v1beta/openai";
const GEMINI_MODEL = "gemini-2.5-flash";

const USERS = {
  auditor1: {pw:"audit@123", role:"auditor",  name:"Alice Auditor",  apps:APPS},
  auditor2: {pw:"audit@456", role:"auditor",  name:"David Auditor",  apps:APPS},
  admin:    {pw:"admin@123", role:"admin",    name:"Admin User",     apps:APPS},
  bankuser1:{pw:"bank@001",  role:"bankuser", name:"BankUser APP001",apps:["APP001"]},
  bankuser2:{pw:"bank@002",  role:"bankuser", name:"BankUser APP002",apps:["APP002"]},
  bankuser3:{pw:"bank@003",  role:"bankuser", name:"BankUser APP003",apps:["APP003"]},
};

// ═══════════════════════════════════════════════════════ LOCAL DOCUMENT STORE
// Structure: DOCS[appId][checklistId] = [{id,name,size,uploadedBy,role,uploadedAt,file}]
const DOCS = {APP001:{},APP002:{},APP003:{}};

const getDocsFor  = (app,cl) => DOCS[app]?.[cl] || [];
const addDoc      = (app,cl,doc) => {
  if(!DOCS[app]) DOCS[app]={};
  if(!DOCS[app][cl]) DOCS[app][cl]=[];
  DOCS[app][cl].push(doc);
};
const allDocsFlat = (app) => {
  const res=[];
  for(const [cl,docs] of Object.entries(DOCS[app]||{}))
    docs.forEach(d=>res.push({...d,checklist_id:cl}));
  return res;
};

// Coverage is 100% document-driven — no mock vault data
function coverage(app){
  let present=0;
  const items=CHECKLIST.map(item=>{
    const docs=getDocsFor(app,item.id);
    const has=docs.length>0;
    if(has) present++;
    return{...item,docs,has};
  });
  const total=CHECKLIST.length;
  const pct=Math.round(present/total*1000)/10;
  return{total,present,missing:total-present,pct,gapPct:Math.round((total-present)/total*1000)/10,items};
}

// ═══════════════════════════════════════════════════════ STATE
let S={
  view:"login",user:null,appId:"APP001",nav:"audit",
  modal:null,excModal:null,exceptions:{},
  msgs:[],aiLoading:false,chatInput:"",
  uploadApp:"APP001",uploadCL:"",uploadFile:null,
};
const set=p=>{Object.assign(S,p);render();};

// ═══════════════════════════════════════════════════════ AI CHAT
async function sendChat(){
  const q=S.chatInput.trim();
  if(!q||S.aiLoading) return;
  const msg={role:"user",content:q,ts:hhmm()};
  set({msgs:[...S.msgs,msg],aiLoading:true,chatInput:""});

  // Build rich context from local doc store
  const cov=coverage(S.appId);
  const itemCtx=cov.items.map(it=>{
    if(it.docs.length===0) return `${it.id} (${it.title}): NO DOCUMENT — MISSING`;
    return `${it.id} (${it.title}): ${it.docs.length} file(s) — ${it.docs.map(d=>d.name).join(", ")} [uploaded by ${[...new Set(it.docs.map(d=>d.uploadedBy))].join(", ")}]`;
  }).join("\n");

  const sys=`You are an expert audit assistant for a banking Audit Evidence Vault.
Help auditors and bank users understand evidence status, coverage, and uploaded documents.

FIXED 7-ITEM BANK CHECKLIST:
BK001 CMDB Integration | BK002 CyberArk Integration | BK003 Architecture Diagram
BK004 Data Flow Diagram | BK005 OS Baseline Sign-off | BK006 DB Sign-off | BK007 DAM Integration

CURRENT APP: ${S.appId}
COVERAGE: ${cov.pct}% complete (${cov.present} of ${cov.total} items have uploaded documents, ${cov.missing} missing)

DOCUMENT STATUS (from local storage):
${itemCtx}

RULES:
• Reference checklist IDs (BK001–BK007) in answers
• When user asks to "show", "fetch", "retrieve" or "list" documents, name the exact files from the context above
• When asked what is missing, list the BK IDs with "NO DOCUMENT"
• When asked for coverage/completion, give exact numbers
• Do NOT invent files or evidence not listed in the context
• Keep responses concise and structured`;

  try{
    const r=await fetch(`${GEMINI_BASE}/chat/completions`,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${GEMINI_KEY}`},
      body:JSON.stringify({model:GEMINI_MODEL,max_tokens:900,
        messages:[{role:"system",content:sys},{role:"user",content:q}]})
    });
    if(!r.ok) throw new Error(`API error ${r.status}: ${await r.text()}`);
    const data=await r.json();
    const ans=data.choices?.[0]?.message?.content||"No response.";

    // Attach relevant doc cards if user asked to retrieve/show
    let cards=[];
    const isRetrieval=/show|fetch|retrieve|find|get|list|what.*doc|doc.*what/i.test(q);
    if(isRetrieval){
      for(const item of CHECKLIST){
        const mentioned=q.toLowerCase().includes(item.id.toLowerCase())
          || item.title.toLowerCase().split(" ").some(w=>w.length>4&&q.toLowerCase().includes(w.toLowerCase()));
        if(mentioned) cards.push(...getDocsFor(S.appId,item.id).map(d=>({...d,clId:item.id,clTitle:item.title})));
      }
      // "all" / "list all" → return everything
      if(cards.length===0 && /\ball\b|everything|every doc/i.test(q)){
        cards=allDocsFlat(S.appId).map(d=>{
          const it=CHECKLIST.find(c=>c.id===d.checklist_id)||{title:"—"};
          return{...d,clId:d.checklist_id,clTitle:it.title};
        });
      }
    }
    set({msgs:[...S.msgs,msg,{role:"assistant",content:ans,cards,ts:hhmm()}],aiLoading:false});
  }catch(e){
    set({msgs:[...S.msgs,msg,{role:"assistant",content:`⚠ ${e.message}\n\nCheck that GEMINI_KEY is set correctly in the HTML file.`,cards:[],ts:hhmm()}],aiLoading:false});
  }
}

function fmt(t){
  // Safe escape then markdown-lite
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/^[-•*] (.+)$/gm,"<li>$1</li>")
    .replace(/(<li>[\s\S]*?<\/li>)/g,"<ul>$1</ul>")
    .replace(/\n{2,}/g,"</p><p>")
    .replace(/\n/g,"<br/>")
    .replace(/^/,"<p>").replace(/$/,"</p>");
}

// ═══════════════════════════════════════════════════════ EVENT BINDING
function bind(){
  // Login
  const lb=document.getElementById("lbtn");
  if(lb){
    const go=()=>{

      const p=document.getElementById("lp").value;
      const e=login(u,p);
      if(e) document.getElementById("lerr").innerHTML=`<div class="l-err">${e}</div>`;
    };
    lb.onclick=go;
    document.getElementById("lp")?.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  }

  // Sign out
  document.getElementById("sout")?.addEventListener("click",()=>
    set({view:"login",user:null,msgs:[],exceptions:{},uploadFile:null}));

  // Nav links
  document.querySelectorAll("[data-nav]").forEach(el=>
    el.addEventListener("click",()=>set({nav:el.dataset.nav})));

  // App selector (sidebar — updates global appId)
  document.getElementById("appsel")?.addEventListener("change",e=>set({appId:e.target.value}));

  // Checklist VIEW buttons
  document.querySelectorAll("[data-vd]").forEach(btn=>btn.addEventListener("click",()=>{
    const id=btn.dataset.vd;
    const item=CHECKLIST.find(c=>c.id===id);
    const docs=getDocsFor(S.appId,id);
    set({modal:{docs,item}});
  }));

  // RAF/EXC buttons
  document.querySelectorAll("[data-re]").forEach(btn=>btn.addEventListener("click",()=>{
    const item=CHECKLIST.find(c=>c.id===btn.dataset.re);
    if(item) set({excModal:item});
  }));

  // Modal close
  document.getElementById("cmv")?.addEventListener("click",()=>set({modal:null}));
  document.getElementById("cme")?.addEventListener("click",()=>set({excModal:null}));
  document.getElementById("ov")?.addEventListener("click",e=>{if(e.target.id==="ov")set({modal:null});});
  document.getElementById("exov")?.addEventListener("click",e=>{if(e.target.id==="exov")set({excModal:null});});

  // Submit exception
  document.getElementById("sexc")?.addEventListener("click",()=>{
    const type=document.getElementById("etype").value;
    const desc=document.getElementById("edesc").value.trim();
    if(!desc){alert("Please enter a description.");return;}
    raiseExc(S.excModal,type,desc);
  });

  // AI chat
  document.getElementById("chat-in")?.addEventListener("input",e=>{S.chatInput=e.target.value;});
  document.getElementById("chat-in")?.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat();}
  });
  document.getElementById("csend")?.addEventListener("click",sendChat);

  // Upload app / checklist selectors
  document.getElementById("uapp")?.addEventListener("change",e=>set({uploadApp:e.target.value,uploadCL:"",uploadFile:null}));
  document.getElementById("ucl")?.addEventListener("change",e=>{S.uploadCL=e.target.value;render();});

  // Drop zone
  const dz=document.getElementById("dz");
  const fi=document.getElementById("fin");
  dz?.addEventListener("click",()=>fi?.click());
  fi?.addEventListener("change",e=>{if(e.target.files[0])set({uploadFile:e.target.files[0]});});
  dz?.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
  dz?.addEventListener("dragleave",()=>dz.classList.remove("over"));
  dz?.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");if(e.dataTransfer.files[0])set({uploadFile:e.dataTransfer.files[0]});});
  document.getElementById("ubtn")?.addEventListener("click",doUpload);
}

// ═══════════════════════════════════════════════════════ BOOT
render();
</script>
</body>
</html>
